openapi: "3.1.0"
info:
  title: Api
  version: "1.0.0"
  description: MesaFácil API - Plataforma de gestão de eventos e mapas de assentos
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Event management
  - name: guests
    description: Guest management
  - name: floor-items
    description: Floor map items

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List all events
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{eventId}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event by ID
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events/{eventId}/stats:
    get:
      operationId: getEventStats
      tags: [events]
      summary: Get event seating statistics
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStats"
        "404":
          description: Not found

  /events/{eventId}/guests:
    get:
      operationId: listGuests
      tags: [guests]
      summary: List guests for an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"
    post:
      operationId: createGuest
      tags: [guests]
      summary: Add a guest to an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"

  /events/{eventId}/guests/{guestId}:
    patch:
      operationId: updateGuest
      tags: [guests]
      summary: Update guest (assign seat, update info)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: guestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "404":
          description: Not found
    delete:
      operationId: deleteGuest
      tags: [guests]
      summary: Delete guest from event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: guestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events/{eventId}/guests/{guestId}/checkin:
    patch:
      operationId: toggleGuestCheckin
      tags: [guests]
      summary: Toggle guest check-in status
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: guestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "404":
          description: Not found

  /events/{eventId}/floor-items:
    get:
      operationId: listFloorItems
      tags: [floor-items]
      summary: List all floor items for event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FloorItem"
    post:
      operationId: createFloorItem
      tags: [floor-items]
      summary: Add a floor item to the event map
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FloorItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloorItem"

  /events/{eventId}/floor-items/{floorItemId}:
    patch:
      operationId: updateFloorItem
      tags: [floor-items]
      summary: Update floor item (position, size, rotation, label)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: floorItemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FloorItemUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloorItem"
        "404":
          description: Not found
    delete:
      operationId: deleteFloorItem
      tags: [floor-items]
      summary: Delete floor item from map
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
        - name: floorItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Event:
      type: object
      required: [id, name, date, type, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        date:
          type: string
          format: date
        type:
          type: string
          enum: [wedding, birthday, graduation, corporate, other]
        venue:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    EventInput:
      type: object
      required: [name, date, type]
      properties:
        name:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        type:
          type: string
          enum: [wedding, birthday, graduation, corporate, other]
        venue:
          type: string
        notes:
          type: string

    EventUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        type:
          type: string
          enum: [wedding, birthday, graduation, corporate, other]
        venue:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    EventStats:
      type: object
      required: [totalGuests, assignedGuests, unassignedGuests, checkedInGuests, totalSeats, occupiedSeats, availableSeats]
      properties:
        totalGuests:
          type: integer
        assignedGuests:
          type: integer
        unassignedGuests:
          type: integer
        checkedInGuests:
          type: integer
        totalSeats:
          type: integer
        occupiedSeats:
          type: integer
        availableSeats:
          type: integer

    Guest:
      type: object
      required: [id, eventId, name, checkedIn, createdAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        name:
          type: string
        phone:
          type: ["string", "null"]
        group:
          type: ["string", "null"]
        vocativo:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        ageRange:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        checkedIn:
          type: boolean
        checkedInAt:
          type: ["string", "null"]
          format: date-time
        floorItemId:
          type: ["integer", "null"]
        seatNumber:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    GuestInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
        group:
          type: string
        vocativo:
          type: string
        gender:
          type: string
        ageRange:
          type: string
        notes:
          type: string

    GuestUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: ["string", "null"]
        group:
          type: ["string", "null"]
        vocativo:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        ageRange:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        floorItemId:
          type: ["integer", "null"]
        seatNumber:
          type: ["integer", "null"]

    FloorItem:
      type: object
      required: [id, eventId, type, x, y, width, height, rotation, capacity, createdAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        type:
          type: string
          enum: [round-table, rectangle-table, square-table, couple-table, buffet-table, stage, bathroom, dj-booth, entrance, emergency-exit]
        label:
          type: ["string", "null"]
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        rotation:
          type: number
        capacity:
          type: integer
        createdAt:
          type: string
          format: date-time

    FloorItemInput:
      type: object
      required: [type, x, y, width, height, capacity]
      properties:
        type:
          type: string
          enum: [round-table, rectangle-table, square-table, couple-table, buffet-table, stage, bathroom, dj-booth, entrance, emergency-exit]
        label:
          type: string
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        rotation:
          type: number
        capacity:
          type: integer

    FloorItemUpdate:
      type: object
      properties:
        type:
          type: string
          enum: [round-table, rectangle-table, square-table, couple-table, buffet-table, stage, bathroom, dj-booth, entrance, emergency-exit]
        label:
          type: ["string", "null"]
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        rotation:
          type: number
        capacity:
          type: integer
